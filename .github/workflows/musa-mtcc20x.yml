name: MUSA MTCC20X

on:
  push:
    branches:
      - ci/musa-sdk53-mtcc20x-20261019
  workflow_dispatch:
    inputs:
      source_ref:
        description: SGLang revision to test
        required: true
        default: fe244ce161e7d4d09e54504a898129c0a445926b
        type: string

concurrency:
  group: musa-mtcc20x-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jit-compatibility:
    runs-on: s5000-1-gpu-runner
    timeout-minutes: 240
    env:
      MUSA_MTCC20X_HOME: ${{ vars.MUSA_MTCC20X_HOME }}
      MUSA_MTCC20X_ARCHIVE_URL: ${{ vars.MUSA_MTCC20X_ARCHIVE_URL }}
      MUSA_MTCC20X_ARCHIVE_SHA256: ${{ vars.MUSA_MTCC20X_ARCHIVE_SHA256 }}
      MTGPU_TARGET: mp_31
      TORCHADA_ENABLE_CPP_OPS: 1
      HF_HUB_CACHE: /hf-cache/hub
      PYTHONPATH: ${{ github.workspace }}/python
    steps:
      - name: Checkout source
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'fe244ce161e7d4d09e54504a898129c0a445926b' }}
        run: |
          archive="${RUNNER_TEMP}/sglang-source.tar.gz"
          curl --fail --location \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output "${archive}" \
            "https://codeload.github.com/yingzhou-bjtu/sglang/tar.gz/${SOURCE_REF}"
          tar -xzf "${archive}" --strip-components=1 -C "${GITHUB_WORKSPACE}"

      - name: Provision MUSA toolchain
        run: |
          if [[ ! -x "${MUSA_MTCC20X_HOME}/bin/mcc" ]]; then
            archive="${RUNNER_TEMP}/musa_toolkits_install_full.tar.gz"
            curl --fail --location --retry 5 --retry-delay 5 \
              --output "${archive}" "${MUSA_MTCC20X_ARCHIVE_URL}"
            printf '%s  %s\n' "${MUSA_MTCC20X_ARCHIVE_SHA256}" "${archive}" \
              | sha256sum --check -
            sudo mkdir -p /opt/musa-mtcc20x
            sudo tar -xzf "${archive}" -C /opt/musa-mtcc20x
            sudo ln -sfn /opt/musa-mtcc20x/musa_toolkits_5.1.0 /opt/musa-mtcc20x/musa
          fi

      - name: Configure MUSA toolchain
        run: |
          test -x "${MUSA_MTCC20X_HOME}/bin/mcc"
          test -d "${MUSA_MTCC20X_HOME}/include"
          test -e "${MUSA_MTCC20X_HOME}/lib/libmusart.so"

          {
            echo "MUSA_HOME=${MUSA_MTCC20X_HOME}"
            echo "PYTORCH_MCC=${MUSA_MTCC20X_HOME}/bin/mcc"
            echo "PATH=${MUSA_MTCC20X_HOME}/bin:${PATH}"
            echo "LD_LIBRARY_PATH=${MUSA_MTCC20X_HOME}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
            echo "SGLANG_JIT_CACHE_DIR=${RUNNER_TEMP}/sglang-jit-cache"
          } >> "${GITHUB_ENV}"

      - name: Verify MTCC20X compiler
        run: |
          python3 -c "import torch; print(torch.__version__); print(torch.musa.device_count())"
          compiler_version="$("$PYTORCH_MCC" --version)"
          printf '%s\n' "$compiler_version"
          grep -q 'clang version 20\.' <<< "$compiler_version"

      - name: Add MUSA CUDA header shims
        run: |
          shim_dir="${RUNNER_TEMP}/musa-cuda-shims"
          mkdir -p "${shim_dir}"
          printf '%s\n' \
            '#pragma once' \
            '#include <musa_bf16.h>' \
            'using __nv_bfloat16 = __mt_bfloat16;' \
            'using __nv_bfloat162 = __mt_bfloat162;' \
            > "${shim_dir}/cuda_bf16.h"
          printf '%s\n' \
            '#pragma once' \
            '#include <musa_fp16.h>' \
            > "${shim_dir}/cuda_fp16.h"
          echo "CPATH=${shim_dir}${CPATH:+:${CPATH}}" >> "${GITHUB_ENV}"

      - name: Install test-only dependencies
        timeout-minutes: 10
        run: |
          python3 -m pip install --user \
            aiohttp \
            IPython \
            msgspec \
            numpy \
            orjson \
            pillow \
            psutil \
            pybase64 \
            requests \
            scipy \
            setproctitle \
            starlette \
            tqdm

      - name: Run MUSA JIT tests
        timeout-minutes: 60
        run: |
          pytest test/registered/unit/kernels/test_jit_cache.py
          pytest test/registered/kernels/ops/speculative/test_ngram_embedding.py
          pytest test/registered/kernels/ops/moe/test_jit_grouped_topk.py
          pytest test/registered/kernels/ops/quantization/test_hadamard_jit.py
          pytest python/sglang/kernels/aot/tests/test_torch_defaults_reset.py

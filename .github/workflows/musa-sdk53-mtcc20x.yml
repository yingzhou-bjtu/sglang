name: MUSA SDK 5.3 + MTCC20X

on:
  push:
    branches:
      - ci/musa-sdk53-mtcc20x-20261019
  workflow_dispatch:
    inputs:
      source_ref:
        description: SGLang revision to test
        required: true
        default: fe244ce161e7d4d09e54504a898129c0a445926b
        type: string

concurrency:
  group: musa-sdk53-mtcc20x-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jit-compatibility:
    runs-on: s5000-1-gpu-runner
    timeout-minutes: 240
    env:
      MUSA_MTCC20X_HOME: ${{ vars.MUSA_MTCC20X_HOME }}
      MUSA_MTCC20X_ARCHIVE_URL: ${{ vars.MUSA_MTCC20X_ARCHIVE_URL }}
      MUSA_MTCC20X_ARCHIVE_SHA256: ${{ vars.MUSA_MTCC20X_ARCHIVE_SHA256 }}
      MUSA_RUNTIME_VERSION: 5.3.0
      MTGPU_TARGET: mp_31
      TORCHADA_ENABLE_CPP_OPS: 1
      HF_HUB_CACHE: /hf-cache/hub
      PYTHONPATH: ${{ github.workspace }}/python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'fe244ce161e7d4d09e54504a898129c0a445926b' }}

      - name: Provision MUSA toolchain
        run: |
          if [[ ! -x "${MUSA_MTCC20X_HOME}/bin/mcc" ]]; then
            archive="${RUNNER_TEMP}/musa_toolkits_install_full.tar.gz"
            curl --fail --location --retry 5 --retry-delay 5 \
              --output "${archive}" "${MUSA_MTCC20X_ARCHIVE_URL}"
            printf '%s  %s\n' "${MUSA_MTCC20X_ARCHIVE_SHA256}" "${archive}" \
              | sha256sum --check -
            sudo mkdir -p /opt/musa-mtcc20x
            sudo tar -xzf "${archive}" -C /opt/musa-mtcc20x
            sudo ln -sfn /opt/musa-mtcc20x/musa_toolkits_5.1.0 /opt/musa-mtcc20x/musa
          fi

      - name: Configure MUSA toolchain
        run: |
          test -x "${MUSA_MTCC20X_HOME}/bin/mcc"
          test -d "${MUSA_MTCC20X_HOME}/include"
          test -e "${MUSA_MTCC20X_HOME}/lib/libmusart.so.${MUSA_RUNTIME_VERSION}"

          {
            echo "MUSA_HOME=${MUSA_MTCC20X_HOME}"
            echo "PYTORCH_MCC=${MUSA_MTCC20X_HOME}/bin/mcc"
            echo "PATH=${MUSA_MTCC20X_HOME}/bin:${PATH}"
            echo "LD_LIBRARY_PATH=${MUSA_MTCC20X_HOME}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "${GITHUB_ENV}"

      - name: Verify SDK and compiler
        run: |
          python3 -c "import torch; print(torch.__version__); print(torch.musa.device_count())"
          compiler_version="$("$PYTORCH_MCC" --version)"
          printf '%s\n' "$compiler_version"
          grep -q 'clang version 20\.' <<< "$compiler_version"

      - name: Install dependencies
        timeout-minutes: 40
        run: |
          wheelhouse="${RUNNER_TEMP}/musa-sdk53-wheelhouse"
          mkdir -p "${wheelhouse}"
          python3 -m pip download \
            --dest "${wheelhouse}" \
            --index-url https://dl.mthreads.com/repo/api/pypi/pypi/simple \
            --trusted-host dl.mthreads.com \
            --no-deps \
            "torch==2.11.0.post2+musa5.2.0" \
            "torch_musa==2.11.0.post2+musa5.2.0" \
            "apache-tvm-ffi==0.1.9.post3+musa.1"

          WHL_DIR="${wheelhouse}" \
            bash scripts/ci/musa/musa_install_dependency.sh --skip-sglang-build

      - name: Install test dependencies
        timeout-minutes: 10
        run: |
          python3 -m pip install --user ipython msgspec orjson

      - name: Run MUSA JIT tests
        timeout-minutes: 60
        run: |
          pytest test/registered/unit/kernels/test_jit_cache.py
          pytest test/registered/kernels/ops/speculative/test_ngram_embedding.py
          pytest python/sglang/kernels/aot/tests/test_torch_defaults_reset.py

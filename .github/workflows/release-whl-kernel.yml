name: Release SGLang Kernels

on:
  push:
    branches:
      - main
      - codex/musa52-e2e-20261123
    paths:
      - .github/workflows/release-whl-kernel.yml
      - python/sglang/kernels/aot/python/sgl_kernel/version.py
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Build target'
        required: false
        default: 'all'
        options:
          - 'all'
          - 'cu130'
          - 'rocm720'
          - 'rocm1000'
          - 'musa52'
      tag_name:
        description: "Version number, must be in the form of vX.Y.Z (e.g. v0.4.0)"
        type: string
        required: false
      pr_number:
        description: "PR number to build from (e.g. 12345)"
        type: string
        required: false

concurrency:
  group: release-sglang-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cu130-matrix:
    if: |
      github.repository == 'sgl-project/sglang' &&
      (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'cu130')
    strategy:
      matrix:
        python-version: ["3.11"]
        cuda-version: ["13.0"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: x64-kernel-build-node
          - arch: aarch64
            runner: arm-kernel-build-node
    runs-on: ${{ matrix.runner }}
    steps:
      # Self-hosted build nodes retain the workspace across jobs. Prior builds
      # leave root-owned artifacts under python/sglang/kernels/aot/build/ that actions/checkout
      # cannot remove, causing EACCES on rmdir. Wipe them via a throwaway root
      # container before checkout recreates the workspace.
      - name: Clean workspace (remove root-owned files from prior runs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        run: |
          cd python/sglang/kernels/aot
          chmod +x ./build.sh
          ./build.sh "${{ matrix.python-version }}" "${{ matrix.cuda-version }}" ${{ matrix.arch == 'aarch64' && 'aarch64' || '' }}
        env:
          BUILD_JOBS: 64
          NVCC_THREADS: 8

      - name: Strip +cu130 local version for PyPI upload
        working-directory: python/sglang/kernels/aot
        run: |
          set -eux
          pip install wheel
          mkdir -p dist-pypi
          for w in dist/*.whl; do
            tmp=$(mktemp -d)
            python3 -m wheel unpack "$w" --dest "$tmp"
            unpacked=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -1)
            info=$(find "$unpacked" -maxdepth 1 -type d -name "*.dist-info" | head -1)
            meta="$info/METADATA"
            orig=$(grep '^Version:' "$meta" | head -1 | sed 's/^Version:[[:space:]]*//')
            new=$(echo "$orig" | sed 's/+cu[0-9]\+$//')
            if [ "$orig" != "$new" ]; then
              sed -i "s/^Version:.*/Version: ${new}/" "$meta"
              old_base=$(basename "$info")
              new_base="${old_base/${orig}/${new}}"
              mv "$info" "$(dirname "$info")/${new_base}"
            fi
            python3 -m wheel pack "$unpacked" --dest-dir dist-pypi
            rm -rf "$tmp"
          done
          ls -lh dist-pypi/

      - name: Upload to PyPI
        working-directory: python/sglang/kernels/aot
        run: |
          pip install twine
          python3 -m twine upload --skip-existing dist-pypi/* -u __token__ -p ${{ secrets.PYPI_TOKEN_SGLANG_KERNEL }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-python${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}
          path: python/sglang/kernels/aot/dist/*

  release-cu130:
    needs: build-cu130-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-*

      - name: Set tag name
        id: set_tag_name
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            TAG_NAME="v$(cat python/sglang/kernels/aot/python/sgl_kernel/version.py | cut -d'"' -f2)"
          else
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          # Prefix with the package name so the release tag in sgl-project/whl
          # does not collide with other packages that share the version number.
          echo "tag_name=sglang-kernel-${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag_name.outputs.tag_name }}
          repository: sgl-project/whl
          token: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}
          files: |
            python/sglang/kernels/aot/dist/*

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/sgl-project/whl.git sgl-whl
        env:
          WHL_TOKEN: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}

      - name: Update wheel index
        run: python3 scripts/update_kernel_whl_index.py --cuda 130

      - name: Push wheel index
        run: |
          cd sgl-whl
          git config --local user.name "sglang-bot"
          git config --local user.email "sglangbot@gmail.com"
          git add -A
          git commit -m "update whl index"
          git push

  build-rocm-matrix:
    if: |
      github.repository == 'sgl-project/sglang' &&
      (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'rocm720' || github.event.inputs.target == 'rocm1000')
    runs-on: amd-docker-scale
    strategy:
      matrix:
        python-version: ["3.10"]
        # ROCm 10.0.0 builds inside a Python 3.12 container; the wheel is still
        # tagged cp310-abi3 (build_rocm.sh sets wheel.py-api to cp310 for every
        # ROCm flavor), so it stays under the same python-version leg as the 7.x
        # wheels.
        #
        # A dispatch that names one flavor builds only that flavor. Every extra
        # leg is another image build on the shared AMD node, and its release job
        # appends the same wheel to the index a second time. `inputs` is empty
        # on push, which falls through to the full set.
        rocm-version: ${{ fromJson(inputs.target == 'rocm720' && '["720"]' || inputs.target == 'rocm1000' && '["1000"]' || '["720", "1000"]') }}
    steps:
      # Self-hosted build nodes retain the workspace across jobs. Prior builds
      # leave root-owned artifacts under python/sglang/kernels/aot/build/ that actions/checkout
      # cannot remove, causing EACCES on rmdir. Wipe them via a throwaway root
      # container before checkout recreates the workspace.
      - name: Clean workspace (remove root-owned files from prior runs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        run: |
          cp 3rdparty/amd/wheel/sgl-kernel/* python/sglang/kernels/aot/
          cd python/sglang/kernels/aot
          chmod +x ./build_rocm.sh
          ./build_rocm.sh "${{ matrix.rocm-version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-python${{ matrix.python-version }}-rocm${{ matrix.rocm-version }}
          path: python/sglang/kernels/aot/dist/*

  release-rocm720:
    needs: build-rocm-matrix
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'rocm720' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-*-rocm720

      - name: Set tag name
        id: set_tag_name
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            TAG_NAME="v$(cat python/sglang/kernels/aot/python/sgl_kernel/version.py | cut -d'"' -f2)"
          else
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          # Prefix with the package name so the release tag in sgl-project/whl
          # does not collide with other packages that share the version number.
          echo "tag_name=sglang-kernel-${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag_name.outputs.tag_name }}
          repository: sgl-project/whl
          token: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}
          files: |
            python/sglang/kernels/aot/dist/*

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/sgl-project/whl.git sgl-whl
        env:
          WHL_TOKEN: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}

      - name: Update wheel index
        run: python3 scripts/update_kernel_whl_index.py --rocm 720

      - name: Push wheel index
        run: |
          cd sgl-whl
          git config --local user.name "sglang-bot"
          git config --local user.email "sglangbot@gmail.com"
          git add -A
          git commit -m "update whl index"
          git push

  release-rocm1000:
    needs: build-rocm-matrix
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'rocm1000' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-*-rocm1000

      - name: Set tag name
        id: set_tag_name
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            TAG_NAME="v$(cat python/sglang/kernels/aot/python/sgl_kernel/version.py | cut -d'"' -f2)"
          else
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          # Prefix with the package name so the release tag in sgl-project/whl
          # does not collide with other packages that share the version number.
          echo "tag_name=sglang-kernel-${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag_name.outputs.tag_name }}
          repository: sgl-project/whl
          token: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}
          files: |
            python/sglang/kernels/aot/dist/*

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/sgl-project/whl.git sgl-whl
        env:
          WHL_TOKEN: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}

      - name: Update wheel index
        run: python3 scripts/update_kernel_whl_index.py --rocm 1000

      - name: Push wheel index
        run: |
          cd sgl-whl
          git config --local user.name "sglang-bot"
          git config --local user.email "sglangbot@gmail.com"
          git add -A
          git commit -m "update whl index"
          git push

  build-musa52:
    if: |
      (github.repository == 'sgl-project/sglang' ||
       github.repository == 'yingzhou-bjtu/sglang') &&
      (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'musa52')
    runs-on: ${{ github.repository == 'sgl-project/sglang' && 'kernel-build-node-musa' || 's5000-1-gpu-runner' }}
    strategy:
      matrix:
        python-version: ["3.12"]
        musa-version: ["52"]
    steps:
      # Self-hosted build nodes retain the workspace across jobs. Prior builds
      # leave root-owned artifacts under python/sglang/kernels/aot/build/ that actions/checkout
      # cannot remove, causing EACCES on rmdir. Wipe them via a throwaway root
      # container before checkout recreates the workspace.
      - name: Clean workspace (remove root-owned files from prior runs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      - name: Route checkout through the GitHub mirror
        env:
          SGLANG_MUSA_GIT_PROXY: ${{ vars.SGLANG_MUSA_GIT_PROXY || 'https://gh-proxy.org/' }}
        run: |
          if [ "${SGLANG_MUSA_GIT_PROXY}" = "direct" ]; then
            exit 0
          fi
          if ! [[ "${SGLANG_MUSA_GIT_PROXY}" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::SGLANG_MUSA_GIT_PROXY must be an HTTPS URL or 'direct'"
            exit 1
          fi
          mirror="${SGLANG_MUSA_GIT_PROXY%/}/"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.${mirror}https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
            echo "CHECKOUT_MIRROR_CONFIGURED=1"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Restore Git config after checkout
        run: |
          # Do not rewrite setup_musa.py's direct fallback after checkout.
          if [ "${CHECKOUT_MIRROR_CONFIGURED:-}" = "1" ]; then
            echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
          fi

      - name: Clean stale torchada extension locks
        run: |
          if ps -eo comm=,args= | grep -E '(^|[[:space:]])(mcc|ninja)([[:space:]]|$)|torchada_cpp_ops' | grep -v grep; then
            echo "::error::Active torchada extension build detected; refusing to remove lock files"
            exit 1
          fi
          find "${HOME}/.cache/torch_extensions" \
            -path '*/torchada_cpp_ops/lock' \
            -type f \
            -print \
            -delete 2>/dev/null || true

      # The self-hosted node keeps its own torchada in ~/.local. Install the
      # pinned release into a job-local prefix so the build does not depend on
      # whatever version the node happens to carry.
      - name: Install torchada
        run: |
          python -m pip install --no-deps --target "${RUNNER_TEMP}/torchada" "torchada==0.1.112"
          echo "PYTHONPATH=${RUNNER_TEMP}/torchada${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Record MUSA 5.2 runner stack
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          import torchada  # noqa: F401
          import torch
          import torch_musa

          assert sys.version_info[:2] == (3, 12), sys.version
          assert torch.__version__ == "2.13.0.post1+musa5.2.0", torch.__version__
          assert torch_musa.__version__ == "2.13.0.post1+musa5.2.0", torch_musa.__version__
          assert importlib.metadata.version("torchada") == "0.1.112"
          assert importlib.metadata.version("compressed-tensors") == "0.17.0"
          assert torch.musa.is_available()
          print("PYTHON", sys.version)
          print("TORCH", torch.__version__)
          print("TORCH_MUSA", torch_musa.__version__)
          print("TORCHADA", importlib.metadata.version("torchada"))
          print("COMPRESSED_TENSORS", importlib.metadata.version("compressed-tensors"))
          print("MUSA_AVAILABLE", torch.musa.is_available())
          PY
          mcc --version

      - name: Build wheels
        env:
          # The build nodes reach github.com very slowly, so the pinned
          # third-party sources are fetched through a mirror by default.
          # Override it with the repository variable, or set it to `direct`.
          SGLANG_MUSA_GIT_PROXY: ${{ vars.SGLANG_MUSA_GIT_PROXY || 'https://gh-proxy.org/' }}
        run: |
          cd python/sglang/kernels/aot
          mv pyproject_musa.toml pyproject.toml
          python setup_musa.py sdist bdist_wheel

      - name: Rename MUSA wheels
        run: |
          bash scripts/ci/musa/rename_wheels_musa.sh ${{ matrix.musa-version }} python/sglang/kernels/aot/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-python${{ matrix.python-version }}-musa${{ matrix.musa-version }}
          path: python/sglang/kernels/aot/dist/*

  verify-musa52:
    needs: build-musa52
    if: github.repository == 'yingzhou-bjtu/sglang'
    runs-on: s5000-1-gpu-runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-musa52
          path: python/sglang/kernels/aot/dist/

      - name: Check out whl PR #2
        uses: actions/checkout@v4
        with:
          repository: yingzhou-bjtu/whl
          ref: review/musa52-index-20261120
          path: sgl-whl

      - name: Verify chained PR heads
        run: |
          git diff --quiet 5e2ecc0ffc06109b368d9b79b3122944e130d4cc -- . \
            ':(exclude).github/workflows/release-whl-kernel.yml'
          test "$(git -C sgl-whl rev-parse HEAD)" = "18254a7d46a24c3b7051eda4c87ab2178bbc53b7"

      - name: Run MUSA Python stack tests
        run: python3 scripts/ci/musa/test_musa_python_stack.py

      - name: Update and verify MUSA 5.2 wheel index
        run: |
          python3 scripts/update_kernel_whl_index.py --musa 52
          wheel=$(find python/sglang/kernels/aot/dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          grep -F "musa52" sgl-whl/index.html
          grep -F "$(basename "$wheel")" sgl-whl/musa52/sglang-kernel/index.html
          grep -F "#sha256=" sgl-whl/musa52/sglang-kernel/index.html

      - name: Install wheel and run MUSA kernel smoke
        run: |
          python3 -m pip install --no-deps --target "${RUNNER_TEMP}/torchada" "torchada==0.1.112"
          wheel=$(find python/sglang/kernels/aot/dist -maxdepth 1 -name '*.whl' -print -quit)
          python3 -m pip install --no-deps --target "${RUNNER_TEMP}/sgl-wheel" "$wheel"
          PYTHONPATH="${RUNNER_TEMP}/torchada:${RUNNER_TEMP}/sgl-wheel" python3 - <<'PY'
          import torchada  # noqa: F401
          import torch
          import sgl_kernel

          assert torch.musa.is_available()
          x = torch.randn((2, 16, 512), dtype=torch.float16, device="musa")
          expected = x[..., 256:] * torch.nn.functional.silu(x[..., :256])
          actual = sgl_kernel.silu_and_mul(x)
          torch.testing.assert_close(actual, expected, rtol=1e-3, atol=1e-3)
          torch.musa.synchronize()
          print("MUSA52_E2E_KERNEL_PASS", sgl_kernel.__file__)
          PY

  release-musa52:
    needs: build-musa52
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-*

      - name: Set tag name
        id: set_tag_name
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            TAG_NAME="v$(cat python/sglang/kernels/aot/python/sgl_kernel/version.py | cut -d'"' -f2)"
          else
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          # Prefix with the package name so the release tag in sgl-project/whl
          # does not collide with other packages that share the version number.
          echo "tag_name=sglang-kernel-${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag_name.outputs.tag_name }}
          repository: sgl-project/whl
          token: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}
          files: |
            python/sglang/kernels/aot/dist/*

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/sgl-project/whl.git sgl-whl
        env:
          WHL_TOKEN: ${{ secrets.GH_PAT_FOR_WHL_RELEASE }}

      - name: Update wheel index
        run: python3 scripts/update_kernel_whl_index.py --musa 52

      - name: Push wheel index
        run: |
          cd sgl-whl
          git config --local user.name "sglang-bot"
          git config --local user.email "sglangbot@gmail.com"
          git add -A
          git commit -m "update whl index"
          git push
